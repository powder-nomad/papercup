<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Papercup — page not found</title>
    <!--
      Single-page-app hack for GitHub Pages, adapted from
      https://github.com/rafgraph/spa-github-pages (MIT). When the user hits a
      deep route like /papercup/install/one-liner, GitHub Pages 404s; this
      script rewrites the URL into a query string, redirects to /papercup/,
      and the SPA reads the query in index.html and restores the route.
    -->
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Set to 1 because our base is /papercup/ — one path segment to keep.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
